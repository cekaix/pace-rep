name: Compile iPhone package for personal signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source distribution if present
        run: |
          if [ -f pace-rep-source.zip ]; then unzip -oq pace-rep-source.zip; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and check project
        run: |
          npm ci
          npx tsc --noEmit
          node tests/domain.test.cjs
          node tests/persistence.test.cjs
          node tests/sqlite.test.cjs
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: ios
        run: pod install
      - name: Compile device binary without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          PROJECT=$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p build/package/Payload
          ditto "$APP" "build/package/Payload/$(basename "$APP")"
          cd build/package
          zip -qry ../PACE-REP-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PACE-REP-unsigned
          path: build/PACE-REP-unsigned.ipa
          retention-days: 3
